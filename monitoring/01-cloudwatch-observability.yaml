apiVersion: v1
kind: ConfigMap
metadata:
  name: cwagent-prometheus-config
  namespace: amazon-cloudwatch
data:
  prometheus.yaml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
    scrape_configs:
      - job_name: 'kubernetes-pods-seguidores'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - seguidores-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: Namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: PodName
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-parsers-java
  namespace: amazon-cloudwatch
data:
  parsers_java.conf: |
    [MULTILINE_PARSER]
        name          java_stacktrace
        type          regex
        flush_timeout 1000
        # Agrupa excepciones de Spring Boot en un solo evento de log en CloudWatch
        rule      "start_state"   "/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3}\s+(ERROR|WARN|INFO|DEBUG)/"  "cont"
        rule      "cont"          "/^(\s+at\s+|\s+\.\.\.\s+\d+\s+more|Caused by:|Exception|java\.|org\.springframework\.)/" "cont"