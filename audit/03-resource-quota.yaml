apiVersion: v1
kind: ResourceQuota
metadata:
  name: seguidores-prod-quota
  namespace: seguidores-prod
spec:
  hard:
    pods: "10"
    requests.cpu: "3"
    requests.memory: "4Gi"
    limits.cpu: "6"
    limits.memory: "6Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: seguidores-default-limits
  namespace: seguidores-prod
spec:
  limits:
    - type: Container
      default:
        cpu: "1000m"
        memory: "768Mi"
      defaultRequest:
        cpu: "300m"
        memory: "512Mi"