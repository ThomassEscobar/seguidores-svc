apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seguidores-svc-hpa
  namespace: seguidores-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seguidores-svc
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180