apiVersion: apps/v1
kind: Deployment
metadata:
  name: seguidores-svc
  namespace: seguidores-prod
  labels:
    app: seguidores-svc
    version: v1
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Garantiza cero tiempo de inactividad (Zero-Downtime)
  selector:
    matchLabels:
      app: seguidores-svc
  template:
    metadata:
      labels:
        app: seguidores-svc
      annotations:
        # Autodescubrimiento para CloudWatch Container Insights / Prometheus
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: seguidores-svc-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seguidores-svc
          # El pipeline reemplaza esta imagen con el digest/tag inmutable de Amazon ECR
          image: IMAGE_URI_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: seguidores-svc-config
            - secretRef:
                name: seguidores-svc-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Spring Boot/Tomcat requiere /tmp; se monta emptyDir abajo
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12 # Hasta 75s para arranque inicial de JVM
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-dir
          emptyDir: {}