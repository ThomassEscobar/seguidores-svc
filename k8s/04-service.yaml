apiVersion: v1
kind: Service
metadata:
  name: seguidores-svc
  namespace: seguidores-prod
  labels:
    app: seguidores-svc
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: seguidores-svc
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080