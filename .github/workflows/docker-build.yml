name: CI/CD - Tests, Security, Audit, ECR & AWS EKS Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: seguidores-svc
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || 'seguidores-eks-cluster' }}
  K8S_NAMESPACE: seguidores-prod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests and coverage check (Unit + Cucumber)
        run: mvn -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk Open Source
        uses: snyk/actions/maven-3-jdk-21@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical

      - name: Run Snyk Code (SAST)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=critical .

      - name: Run Checkov IaC Compliance Audit (k8s/, monitoring/, audit/)
        uses: bridgecrewio/checkov-action@master
        with:
          config_file: audit/.checkov.yaml
          output_format: cli
          soft_fail: true

  docker-build:
    needs: [test, security]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      image_uri: ${{ steps.push-ecr.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:v1
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push image to Amazon ECR
        id: push-ecr
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:v1
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: [test, security, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for AWS EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Inject ECR image URI into Kubernetes Deployment
        env:
          IMAGE_URI: ${{ needs.docker-build.outputs.image_uri }}
        run: |
          sed -i "s|IMAGE_URI_PLACEHOLDER|${IMAGE_URI}|g" k8s/03-deployment.yaml

      - name: Apply Audit & Governance Controls (audit/)
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f audit/01-rbac.yaml
          kubectl apply -f audit/02-network-policy.yaml
          kubectl apply -f audit/03-resource-quota.yaml

      - name: Deploy to AWS EKS (k8s/)
        run: |
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/02-secret.yaml
          kubectl apply -f k8s/03-deployment.yaml
          kubectl apply -f k8s/04-service.yaml
          kubectl apply -f k8s/05-hpa.yaml

      - name: Apply CloudWatch Observability Config (monitoring/)
        run: |
          kubectl apply -f monitoring/01-cloudwatch-observability.yaml || true

      - name: Post-deploy Verification & Rollback on Failure
        run: |
          if ! kubectl rollout status deployment/seguidores-svc -n ${{ env.K8S_NAMESPACE }} --timeout=300s; then
            echo "❌ El despliegue no estabilizó. Ejecutando rollback..."
            kubectl rollout undo deployment/seguidores-svc -n ${{ env.K8S_NAMESPACE }}
            kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.lastTimestamp'
            exit 1
          fi

      - name: Show Cloud Orchestrator Status (Evidencia)
        run: |
          echo "=== Pods, Réplicas y Servicio LoadBalancer en EKS ==="
          kubectl get pods,svc,hpa -n ${{ env.K8S_NAMESPACE }} -o wide
          echo "=== Controles de Cumplimiento Activos ==="
          kubectl get networkpolicy,resourcequota,limitrange,role,rolebinding -n ${{ env.K8S_NAMESPACE }}