name: CI/CD - Tests, Security, Build & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run tests and coverage check
        run: mvn -B verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk Open Source
        uses: snyk/actions/maven-3-jdk-21@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical
      - name: Run Snyk Code (SAST)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=critical .

  docker-build:
    needs: [test, security]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }} # Exportamos el tag para el deploy
    steps:
      - uses: actions/checkout@v4
      
      # Extraer el SHA corto del commit para trazabilidad
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Construimos y Guardamos la imagen en un archivo .tar para pasarla al deploy
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            mi-micro:v1
            mi-micro:${{ steps.vars.outputs.sha_short }}
          outputs: type=docker,dest=/tmp/mi-micro.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/mi-micro.tar
          retention-days: 1

  deploy:
    needs: [test, security, docker-build]
    runs-on: ubuntu-latest
    # Solo desplegamos en la rama main (puedes cambiarlo a develop si quieres)
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
          
      - name: Load Docker image
        run: docker load --input /tmp/mi-micro.tar
      
      - name: Deploy with Docker Compose
        env:
          # Inyectamos el SHA del commit como variable de entorno para el compose
          IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
        run: docker compose up -d
        
      - name: Post-deploy Verification (Healthcheck)
        run: |
          echo "Esperando a que el servicio arranque..."
          sleep 15
          curl --fail http://localhost:8080/actuator/health || exit 1
          
      - name: Print Logs
        if: failure()
        run: docker compose logs