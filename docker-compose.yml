services:
  app:
    image: mi-micro:${IMAGE_TAG:-latest}
    # Al usar réplicas, Docker asigna nombres automáticos (ej. seguidores-svc-app-1)
    ports:
      - "8080:8080" 
    deploy:
      # En un entorno real (Swarm/K8s) se usarían 2 réplicas. 
      # En este runner de CI, Docker Compose limitará esto para evitar conflictos de puerto.
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped