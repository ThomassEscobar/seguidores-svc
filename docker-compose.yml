services:
  seguidores-svc:
    build: .
    image: mi-micro:v1
    container_name: seguidores-svc
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s