apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: seguidores-eks-cluster
  region: us-east-1
  version: "1.31"

availabilityZones: ["us-east-1a", "us-east-1b"]

iam:
  serviceRoleARN: "arn:aws:iam::039179014004:role/LabRole"
  withOIDC: false

managedNodeGroups:
  - name: workers-standard
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    iam:
      instanceRoleARN: "arn:aws:iam::039179014004:role/LabRole"
